<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyváruház</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap ikonok -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Saját CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <i class="bi bi-book"></i> Könyváruház
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#">Főoldal</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Könyvek</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Kapcsolat</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="container my-5">
        <h1 class="text-center mb-4">Népszerű könyvek</h1>

        <div class="row g-4">

            <!-- Kártya 1 -->
            <div class="col-md-4 col-sm-6">
                <div class="card book-card h-100">
                    <img src="https://picsum.photos/300/200?1" class="card-img-top" alt="könyv">
                    <div class="card-body">
                        <h5 class="card-title">A nagy regény</h5>
                        <p class="card-text">Egy izgalmas történet kalandról és felfedezésről.</p>
                    </div>
                    <div class="card-footer text-center">
                        <button class="btn btn-primary">
                            <i class="bi bi-cart"></i> Vásárlás
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kártya 2 -->
            <div class="col-md-4 col-sm-6">
                <div class="card book-card h-100">
                    <img src="https://picsum.photos/300/200?2" class="card-img-top" alt="könyv">
                    <div class="card-body">
                        <h5 class="card-title">Sci-fi világ</h5>
                        <p class="card-text">Utazás a jövőbe és más bolygókra.</p>
                    </div>
                    <div class="card-footer text-center">
                        <button class="btn btn-primary">
                            <i class="bi bi-cart"></i> Vásárlás
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kártya 3 -->
            <div class="col-md-4 col-sm-6">
                <div class="card book-card h-100">
                    <img src="https://picsum.photos/300/200?3" class="card-img-top" alt="könyv">
                    <div class="card-body">
                        <h5 class="card-title">Tanulj programozni</h5>
                        <p class="card-text">Kezdőknek és haladóknak egyaránt.</p>
                    </div>
                    <div class="card-footer text-center">
                        <button class="btn btn-primary">
                            <i class="bi bi-cart"></i> Vásárlás
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3">
        <p><i class="bi bi-c-circle"></i> 2026 Könyváruház</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
